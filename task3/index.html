<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Bookstore</title>
	<link rel="stylesheet" href="./css/style.css">
</head>
<body>
	<header>
		<h1>Welcome to Our Community Bookstore</h1>
	</header>

	<main class="container">
		<div class="card">
			<h3>Borrow a Book</h3>
			<form id="book-form">
				<div class="form-style">
					<label for="username">Username:</label><br>
					<input class="input-style" type="text" id="username" required>
				</div>
				<div class="form-style">
					<label for="membershipType">Membership -> student or regular:</label>
					<br>
					<input class="input-style" type="text" id="membershipType" required>
				</div>
				<div class="form-style">
					<label for="bookGenre">Book Genre:</label><br>
					<input class="input-style" type="text" id="bookGenre" required>
				</div>
				<div class="form-style">
					<label for="bookTitle">Book Title:</label><br>
					<input class="input-style" type="text" id="bookTitle" required>
				</div>
				<button type="submit">Submit</button>
			</form>
		</div>

		<div class="card" id="result-card">
			<p>Your details will appear here after you submit.</p>
		</div>
	</main>

	<script src="./javascript/app.js"></script>
</body>
</html>
