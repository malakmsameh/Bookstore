<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        h2 {
            font-size: 20px;
        }
        .form-style {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            width: 400px;
        }
        .form-style label {
            font-size: 12px;
            margin-bottom: 4px;
            color: #333;
        }
        .form-style input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .error {
            color: red;
            font-size: 11px;
            margin-top: 3px;
        }
        #register-btn {
            width: 400px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #register-btn:disabled {
            background-color: #7aa7dc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h2>Registration Form</h2>
    
    <form id="register-form">
        <div class="form-style">
            <label for="username">Username:</label>
            <input type="text" id="username">
            <span id="username-error" class="error"></span>
        </div>

        <div class="form-style">
            <label for="password">Password:</label>
            <input type="password" id="password">
            <span id="password-error" class="error"></span>
        </div>

        <div class="form-style">
            <label for="confirm-password">ConfirmPassword:</label>
            <input type="password" id="confirm-password">
            <span id="confirm-error" class="error"></span>
        </div>

        <button type="submit" id="register-btn" disabled>Register</button>
    </form>

    <div id="success-message" style="margin-top: 20px; color: green; font-weight: bold;"></div>

    <script src="./javascript/ex5.js"></script>
</body>
</html>
